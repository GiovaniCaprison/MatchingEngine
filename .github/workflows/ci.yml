# What runs is what the diff can reach. A pull request verifies the modules it names and their
# dependents, a diff that stays inside one language leaves the other job untouched, and a change
# to shared ground, the schema, the corpus, the docs, the build itself, verifies everything. Every
# push to main verifies everything in both languages, so the scoping can only ever delay a
# discovery to the merge, never past it. scripts/scope.py is the map and says why it is shaped the
# way it is.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A follow-up push cancels the run it obsoleted, since two runs of one branch answer the same
# question twice and the second answer is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.decide.outputs.java }}
      cpp: ${{ steps.decide.outputs.cpp }}
      modules: ${{ steps.decide.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the base of the diff is present to diff against.
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE"...HEAD | python3 scripts/scope.py "$EVENT"
          else
            python3 scripts/scope.py "$EVENT" </dev/null
          fi >> "$GITHUB_OUTPUT"

  java:
    needs: scope
    if: needs.scope.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # verify rather than test, because the format check binds there. This is the command a
      # working tree is held to, so the runner and a laptop can only disagree about the machine.
      # One reactor thread per core: the modules are independent and surefire forks one JVM per
      # module, so the engines still run one to a process and the heavy invariants suites run
      # beside each other instead of after each other.
      - if: needs.scope.outputs.modules == ''
        run: mvn --batch-mode -T 1C verify
        working-directory: java
      # The narrowed build still installs the whole reactor first, without tests, so the format
      # check covers every file and the scoped modules resolve their dependencies; then the named
      # modules and everything depending on them verify in full.
      - if: needs.scope.outputs.modules != ''
        env:
          MODULES: ${{ needs.scope.outputs.modules }}
        run: |
          mvn --batch-mode -T 1C install -DskipTests
          mvn --batch-mode -T 1C -pl "$MODULES" -amd verify
        working-directory: java

  cpp:
    needs: scope
    if: needs.scope.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: cpp
      - run: cmake --build build
        working-directory: cpp
      - run: ctest --test-dir build --output-on-failure
        working-directory: cpp
      # Both formatters are pinned: the Java one in the parent pom, this one in
      # .clang-format-version, fetched exactly by pipx so the runner and a laptop cannot disagree
      # about wrapping. The fetched dependencies stay out of the sweep.
      - run: |
          find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 pipx run clang-format==$(cat ../.clang-format-version) --dry-run --Werror
        working-directory: cpp
      # The linter at the same pinned LLVM version, reading .clang-tidy and the compile database
      # the configure step wrote, so the runner, a laptop and an editor's clangd agree on every
      # finding. Sources only: headers are checked through their includers via HeaderFilterRegex.
      - run: |
          git ls-files '*.cpp' \
            | xargs pipx run clang-tidy==$(cat .clang-format-version) -p cpp/build --quiet
